on:
  push:
    branches: [main] # change to master if needed

name: 🚀 Deploy Production

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Set NEXT_PUBLIC_APP_VERSION from package.json
        run: echo "NEXT_PUBLIC_APP_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: Build
        env:
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_APP_VERSION: ${{ env.NEXT_PUBLIC_APP_VERSION }}
        run: npm run build

      - name: Prepare deploy folder (standalone)
        run: |
          rm -rf deploy
          mkdir -p deploy

          # copy standalone output
          cp -R .next/standalone/. deploy/

          # copy static assets needed by standalone
          mkdir -p deploy/.next
          cp -R .next/static deploy/.next/static

          # public assets
          cp -R public deploy/public

          # OPTIONAL (use this only if you cannot set env vars on the server):
          # Write runtime env file that Next will load in production.
          cat > deploy/.env.production <<EOF
          AMSA_API_BASE_URL=${{ secrets.AMSA_API_BASE_URL }}
          NEXT_PUBLIC_APP_ENV=production
          NEXT_PUBLIC_APP_VERSION=${{ env.NEXT_PUBLIC_APP_VERSION }}
          EOF

      - name: Debug (must have BUILD_ID)
        run: |
          ls -la deploy
          ls -la deploy/.next || true
          test -f deploy/.next/BUILD_ID || (echo "Missing deploy/.next/BUILD_ID" && exit 1)
          echo "BUILD_ID found ✅"

      - name: FTP Deploy (incremental)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}

          protocol: ftps
          port: 21
          security: loose
          timeout: 120000

          local-dir: deploy/
          server-dir: ./ # change to ./httpdocs/ if that’s your web root

          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            **/.next/cache/**
            **/tmp/**